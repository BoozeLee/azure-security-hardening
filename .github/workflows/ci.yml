name: "CI - Bicep Validation & Security Scan"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  validate:
    name: "Validate Bicep Templates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Install Bicep CLI"
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version

      - name: "Build Bicep Templates"
        run: |
          echo "🔨 Building Bicep templates..."
          for file in infra/*.bicep; do
            echo "Building: $file"
            bicep build "$file" --stdout > /dev/null
          done
          echo "✅ All Bicep templates compiled successfully"

      - name: "Lint Bicep Templates"
        run: bicep lint infra/main.bicep || true

  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Run Checkov IaC Security Scan"
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          framework: bicep
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true

      - name: "Upload SARIF results"
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
        continue-on-error: true

  release:
    name: "Create Release"
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Get version"
        id: version
        run: |
          VERSION="v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: "Create Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Azure Security Hardening ${{ steps.version.outputs.version }}"
          body: |
            ## 🛡️ Azure Security Hardening Release

            **Commit:** ${{ github.sha }}

            ### Security Features
            - Zero Public Access
            - Encryption at Rest & Transit
            - Network Isolation
            - Advanced Threat Protection

            ### Deploy
            \`\`\`bash
            az deployment sub create --location westeurope --template-file infra/main.bicep
            \`\`\`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  qwe-tests:
    name: "QWE Server & CLI Tests"
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QWE dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/qwe/requirements.txt
          pip install -r tools/qwe/requirements-dev.txt

      - name: Run Pytest for QWE
        working-directory: tools/qwe
        run: |
          pytest -q

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck for scripts
        run: |
          shellcheck scripts/qwe-sh
          shellcheck automate-raptor-cli.sh
          shellcheck full-raptor-setup.sh
          shellcheck raptor-admin-setup.sh
          shellcheck deploy-security.sh
          shellcheck deploy-minimal-cost.sh
          shellcheck deploy-emergency.sh

  qa-qwe:
    name: "QA - QWE Orchestrator Dry-Run"
    runs-on: ubuntu-latest
    needs: [validate, qwe-tests]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QWE Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/qwe/requirements.txt

      - name: Start qwe server
        run: |
          chmod +x tools/qwe/start_bg.sh
          ./tools/qwe/start_bg.sh

      - name: Prepare fake CLI bin
        run: |
          chmod +x fakebin/az fakebin/gh
          echo "Adding fakebin to PATH"
          echo "PATH=$GITHUB_WORKSPACE/fakebin:$PATH" >> $GITHUB_ENV

      - name: Run orchestrator in dry-run mode
        env:
          QWE_DRY_RUN: "true"
          QWE_DEBUG: "1"
          USE_LOCAL_COPILOT: "true"
        run: |
          PATH="$GITHUB_WORKSPACE/fakebin:$PATH"
          bash -x ./ai-workflow-orchestrator.sh || (echo "Orchestrator failed"; exit 1)
