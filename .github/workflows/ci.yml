name: 'CI - Bicep Validation & Security Scan'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  validate:
    name: 'Validate Bicep Templates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Install Bicep CLI'
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version

      - name: 'Build Bicep Templates'
        run: |
          echo "🔨 Building Bicep templates..."
          for file in infra/*.bicep; do
            echo "Building: $file"
            bicep build "$file" --stdout > /dev/null
          done
          echo "✅ All Bicep templates compiled successfully"

      - name: 'Lint Bicep Templates'
        run: bicep lint infra/main.bicep || true

  security-scan:
    name: 'Security Scan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Run Checkov IaC Security Scan'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          framework: bicep
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true

      - name: 'Upload SARIF results'
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: results.sarif
        continue-on-error: true

  release:
    name: 'Create Release'
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Get version'
        id: version
        run: |
          VERSION="v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 'Create Release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Azure Security Hardening ${{ steps.version.outputs.version }}"
          body: |
            ## 🛡️ Azure Security Hardening Release
            
            **Commit:** ${{ github.sha }}
            
            ### Security Features
            - Zero Public Access
            - Encryption at Rest & Transit
            - Network Isolation
            - Advanced Threat Protection
            
            ### Deploy
            \`\`\`bash
            az deployment sub create --location westeurope --template-file infra/main.bicep
            \`\`\`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
