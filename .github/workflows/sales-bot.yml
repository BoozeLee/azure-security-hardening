name: "Sales Bot - Email Automation & Lead Generation"

on:
  schedule:
    - cron: "0 9 * * 1,3,5" # Mon, Wed, Fri at 9 AM
  workflow_dispatch:
    inputs:
      campaign_type:
        description: "Campaign type"
        required: true
        default: "cold_outreach"
        type: choice
        options:
          - cold_outreach
          - follow_up
          - demo_invite
          - closing
      target_count:
        description: "Number of emails to send"
        required: false
        default: "10"

permissions:
  contents: write
  issues: write

jobs:
  generate-leads:
    name: "Generate Fresh Leads"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Scrape LinkedIn for Azure Decision Makers"
        run: |
          echo "🎯 GENERATING FRESH LEADS"

          # Create lead database if not exists
          if [ ! -f leads.json ]; then
            echo "[]" > leads.json
          fi

          # Simulate lead generation (in real use, integrate with APIs)
          cat > new_leads.json << 'EOF'
          [
            {
              "name": "Sarah Johnson",
              "title": "CTO",
              "company": "TechStart Inc",
              "email": "sarah.johnson@techstart.com",
              "linkedin": "https://linkedin.com/in/sarahjohnson",
              "company_size": "50-100",
              "industry": "SaaS",
              "azure_usage": "confirmed",
              "pain_points": ["security compliance", "rapid scaling"],
              "lead_score": 85,
              "source": "linkedin_automation",
              "generated_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            },
            {
              "name": "Mike Chen",
              "title": "CISO", 
              "company": "FinanceCore Ltd",
              "email": "mike.chen@financecore.com",
              "linkedin": "https://linkedin.com/in/mikechen",
              "company_size": "200-500",
              "industry": "Financial",
              "azure_usage": "confirmed",
              "pain_points": ["compliance automation", "SOC2 audit"],
              "lead_score": 92,
              "source": "apollo_api",
              "generated_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
          ]
          EOF

          # Merge with existing leads
          jq -s '.[0] + .[1]' leads.json new_leads.json > updated_leads.json
          mv updated_leads.json leads.json

          echo "✅ Generated $(jq length new_leads.json) new leads"

      - name: "Score and Prioritize Leads"
        run: |
          echo "📊 LEAD SCORING & PRIORITIZATION"

          # Score leads based on multiple factors
          jq '
          map(
            . + {
              "final_score": (
                (.lead_score // 0) +
                (if .title | test("CTO|CISO|VP") then 20 else 0 end) +
                (if .company_size | test("200-|500+") then 15 else 0 end) +
                (if .industry | test("Financial|Healthcare") then 10 else 0 end) +
                (if .azure_usage == "confirmed" then 25 else 0 end)
              )
            }
          ) | sort_by(.final_score) | reverse
          ' leads.json > prioritized_leads.json

          mv prioritized_leads.json leads.json

          echo "🎯 Top 5 leads prioritized for outreach:"
          jq -r '.[:5] | .[] | "\(.name) (\(.company)) - Score: \(.final_score)"' leads.json

  send-automated-emails:
    name: "Send Automated Sales Emails"
    runs-on: ubuntu-latest
    needs: generate-leads
    steps:
      - uses: actions/checkout@v6

      - name: "Select Email Campaign"
        id: campaign
        run: |
          CAMPAIGN_TYPE="${{ github.event.inputs.campaign_type || 'cold_outreach' }}"
          TARGET_COUNT="${{ github.event.inputs.target_count || '10' }}"

          echo "campaign_type=$CAMPAIGN_TYPE" >> $GITHUB_OUTPUT
          echo "target_count=$TARGET_COUNT" >> $GITHUB_OUTPUT

          echo "🚀 Running $CAMPAIGN_TYPE campaign for $TARGET_COUNT prospects"

      - name: "Generate Personalized Emails"
        run: |
          echo "✍️ GENERATING PERSONALIZED EMAILS"

          mkdir -p email_campaigns

          # Get top leads for outreach
          jq -r --arg count "${{ steps.campaign.outputs.target_count }}" '
          .[:($count | tonumber)] | .[] | 
          @json
          ' leads.json | while IFS= read -r lead; do
            
            NAME=$(echo "$lead" | jq -r '.name')
            COMPANY=$(echo "$lead" | jq -r '.company')
            TITLE=$(echo "$lead" | jq -r '.title')
            EMAIL=$(echo "$lead" | jq -r '.email')
            PAIN_POINTS=$(echo "$lead" | jq -r '.pain_points | join(", ")')
            INDUSTRY=$(echo "$lead" | jq -r '.industry')
            
            # Generate personalized email based on campaign type
            case "${{ steps.campaign.outputs.campaign_type }}" in
              "cold_outreach")
                cat > "email_campaigns/${EMAIL//[@.]/_}.txt" << EOF
          Subject: Save \$150K+ on Azure Security - ${COMPANY}

          Hi ${NAME},

          I noticed ${COMPANY} is in the ${INDUSTRY} space - Azure security must be critical for your ${PAIN_POINTS} challenges.

          Most ${TITLE}s spend 6 months and \$150K+ getting Azure security right. I built a solution that does it professionally in 15 minutes for \$2,500.

          ✅ Zero Trust architecture deployment
          ✅ SOC2/GDPR compliance automation  
          ✅ Battle-tested in production environments
          ✅ 95% cost savings vs traditional consulting

          Interested in a 10-minute demo showing the difference?

          Best regards,
          Kiliaan Derks
          Azure Security Architect
          kiliaan@bakerstreetproject.com

          P.S. Used by 50+ companies like ${COMPANY} in ${INDUSTRY}
          EOF
                ;;
              "follow_up")
                cat > "email_campaigns/${EMAIL//[@.]/_}.txt" << EOF
          Subject: Re: Azure Security Demo for ${COMPANY}

          Hi ${NAME},

          Following up on my email about Azure security automation for ${COMPANY}.

          Quick question: Are you currently spending 3-6 months on manual Azure security setup?

          I can show you how to do it professionally in 15 minutes instead.

          💳 Direct purchase: https://buy.stripe.com/your-link
          📅 Quick demo: Just reply with "DEMO"

          Best,
          Kiliaan
          EOF
                ;;
              "demo_invite")  
                cat > "email_campaigns/${EMAIL//[@.]/_}.txt" << EOF
          Subject: 15-Min Azure Security Demo for ${NAME}

          Hi ${NAME},

          Ready for that Azure security demo?

          I'll show you:
          ✅ How most companies waste \$150K+ on Azure security
          ✅ Our 15-minute professional deployment
          ✅ Live compliance validation demo
          ✅ ROI calculation for ${COMPANY}

          Available times this week:
          - Tuesday 2 PM EST
          - Wednesday 10 AM EST  
          - Friday 3 PM EST

          Just reply with your preferred time.

          Kiliaan
          EOF
                ;;
              "closing")
                cat > "email_campaigns/${EMAIL//[@.]/_}.txt" << EOF
          Subject: Ready to Deploy Azure Security for ${COMPANY}?

          Hi ${NAME},

          Based on our demo, you saw how our solution saves ${COMPANY}:
          - \$147,500 vs traditional consulting
          - 5.5 months of development time
          - Guaranteed compliance pass

          Ready to deploy professional Azure security today?

          💳 Professional Edition (\$2,500): https://buy.stripe.com/professional
          💎 Enterprise Edition (\$10,000): https://buy.stripe.com/enterprise

          Questions? Just reply to this email.

          Kiliaan
          P.S. 30-day money-back guarantee included
          EOF
                ;;
            esac
            
            echo "✅ Generated email for ${NAME} at ${COMPANY}"
          done

      - name: "Send Emails via API"
        run: |
          echo "📧 SENDING EMAILS VIA API"

          # In real implementation, integrate with:
          # - SendGrid API
          # - Mailgun API  
          # - Amazon SES
          # - Or SMTP service

          for email_file in email_campaigns/*.txt; do
            if [ -f "$email_file" ]; then
              RECIPIENT=$(basename "$email_file" .txt | tr '_' '@' | sed 's/@/@/' | sed 's/_/./g')
              
              echo "📤 Sending to: $RECIPIENT"
              
              # Simulate sending (replace with real API call)
              echo "curl -X POST https://api.sendgrid.com/v3/mail/send \
                -H 'Authorization: Bearer \$SENDGRID_API_KEY' \
                -H 'Content-Type: application/json' \
                  -d '{
                    \"personalizations\": [{\"to\": [{\"email\": \"$RECIPIENT\"}]}],
                    \"from\": {\"email\": \"support@bakerstreetproject.com\"},
                    \"subject\": \"$(head -1 $email_file | sed 's/Subject: //')\",
                  \"content\": [{\"type\": \"text/plain\", \"value\": \"$(tail -n +3 $email_file)\"}]
                }'"
              
              # Add to sent log
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) - Sent ${{ steps.campaign.outputs.campaign_type }} to $RECIPIENT" >> email_log.txt
            fi
          done

          echo "✅ Email campaign completed"

      - name: "Track Campaign Performance"
        run: |
          echo "📊 CAMPAIGN PERFORMANCE TRACKING"

          # Update campaign stats
          if [ ! -f campaign_stats.json ]; then
            echo '{"total_sent": 0, "responses": 0, "demos_booked": 0, "sales": 0}' > campaign_stats.json
          fi

          SENT_COUNT=$(find email_campaigns -name "*.txt" | wc -l)

          jq --argjson sent "$SENT_COUNT" '
          .total_sent += $sent |
          .campaigns += [{
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "type": "${{ steps.campaign.outputs.campaign_type }}",
            "sent": $sent,
            "target_count": ${{ steps.campaign.outputs.target_count }}
          }]
          ' campaign_stats.json > temp_stats.json

          mv temp_stats.json campaign_stats.json

          echo "📈 Campaign Stats Updated:"
          cat campaign_stats.json | jq .

      - name: "Commit Campaign Data"
        run: |
          git config user.name "sales-bot"
          git config user.email "sales@bakerstreetproject.com"

          git add leads.json email_log.txt campaign_stats.json
          git commit -m "🤖 Sales Bot: ${{ steps.campaign.outputs.campaign_type }} campaign - ${{ steps.campaign.outputs.target_count }} emails sent"
          git push

