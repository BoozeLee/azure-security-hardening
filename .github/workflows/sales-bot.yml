          #   "https://api.apollo.io/v1/mixed_companies/search" \
          #   -d '{"technologies": ["Microsoft Azure"], "company_size": ["51-100", "101-500"]}'

          # LinkedIn Sales Navigator API (example)  
          echo "Getting decision makers from LinkedIn..."
          # Use LinkedIn API to find CTOs, CISOs at companies using Azure

          # Clearbit/ZoomInfo integration (example)
          echo "Enriching company data..."
          # Get company size, industry, tech stack, funding status

      - name: "Monitor Competitor Pricing"
        run: |
          echo "👀 COMPETITOR ANALYSIS"

          # Scrape competitor websites for pricing
          # Monitor job postings mentioning Azure security
          # Track industry reports and analyst mentions
          # Adjust pricing strategy automatically

      - name: "Social Media Monitoring"
        run: |
          echo "📱 SOCIAL MEDIA AUTOMATION"

          # Monitor Twitter/X for Azure security complaints
          # Track Reddit posts about Azure misconfiguration
          # Find prospects posting about security challenges
          # Auto-respond with helpful content + solution link

env:
  SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
  APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
  LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
